<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f9edf3">
  <title>人生ゲーム｜ドクダミすごろく</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="game-page life-page">
  <header class="game-header">
    <a class="back-link" href="index.html">← タイトルへ</a>
    <div><p class="eyebrow">LIFE & LUCK MODE</p><h1>人生ゲーム</h1></div>
    <div class="player-count">🎀 のんびりプレイ</div>
  </header>
  <div class="mission-bar" id="lifeMissionBar" aria-live="polite"><span class="mission-bar-kicker">LIFE EVENT</span><strong id="lifeMissionBarTitle">新しい人生のスタート！</strong><span class="mission-bar-text" id="lifeMissionBarText">サイコロを振って、いろんなイベントに出会おう。</span></div>
  <main class="game-layout">
    <section class="board-panel">
      <div class="board-heading"><div><p class="eyebrow">YOUR STORY</p><h2>気ままな人生ロード</h2></div><span class="board-stamp">✨ LIFE GAME</span></div>
      <div class="board" id="lifeBoard" aria-label="人生ゲーム盤面"></div>
      <div class="board-legend"><span>🌱 START</span><span>🎁 EVENT</span><span>🏁 GOAL</span></div>
      <div class="board-garden" id="boardGarden" aria-hidden="true"></div>
    </section>
    <aside class="control-panel">
      <section class="dice-card">
        <p class="eyebrow">ROLL & GO</p><h2>次は何が起きる？</h2>
        <div class="dice-stage"><div class="dice-scene"><div class="dice3d" id="lifeDice" role="img" aria-label="サイコロ"></div></div></div>
        <button class="primary-button" id="lifeRollButton">🎲 サイコロを振る</button>
        <p class="small-note" id="lifeTurnStatus" aria-live="polite">人生は運しだい、のんびり行こう。</p>
        <button class="ghost-button" id="lifeResetButton" type="button">↩ 最初からやり直す</button>
      </section>
      <section class="event-card" aria-live="polite">
        <span class="event-kicker">LIFE EVENT</span><h2 id="lifeEventTitle">新しい人生のスタート！</h2>
        <p id="lifeEventText">サイコロを振って、いろんなイベントに出会おう。</p>
      </section>
      <section class="mini-status"><span>現在地</span><strong id="lifePositionText">START / 0</strong><span class="mini-progress"><i id="lifeProgressBar"></i></span></section>
    </aside>
  </main>
  <div class="modal-backdrop" id="lifeMissionModal" hidden>
    <section class="roulette-modal mission-modal" role="dialog" aria-modal="true" aria-labelledby="lifeMissionTitle">
      <p class="eyebrow">LIFE EVENT</p>
      <div class="mission-flower" aria-hidden="true"><svg class="dokudami-svg" viewBox="0 0 100 130"><path d="M50 128 C47 102 53 80 50 54" stroke="#3e7d3a" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M51 106 C39 90 22 94 24 109 C26 122 43 127 51 118 C59 127 76 122 78 109 C80 94 63 90 51 106 Z" fill="#57a047"/><ellipse cx="50" cy="42" rx="13" ry="6" fill="#ffffff" stroke="#cfd8c8"/><ellipse cx="33" cy="47" rx="13" ry="6" transform="rotate(-28 33 47)" fill="#ffffff" stroke="#cfd8c8"/><ellipse cx="67" cy="47" rx="13" ry="6" transform="rotate(28 67 47)" fill="#ffffff" stroke="#cfd8c8"/><ellipse cx="50" cy="55" rx="16" ry="7" fill="#ffffff" stroke="#cfd8c8"/><rect x="45" y="8" width="10" height="34" rx="5" fill="#ecc94b"/><circle cx="50" cy="16" r="1.6" fill="#c9a227"/><circle cx="48" cy="24" r="1.6" fill="#c9a227"/><circle cx="52" cy="31" r="1.6" fill="#c9a227"/></svg></div>
      <h2 id="lifeMissionTitle">イベント</h2>
      <p id="lifeMissionText"></p>
      <button class="primary-button" id="closeLifeMission" type="button">すすむ</button>
    </section>
  </div>
  <button class="dice-fab" id="diceFab" type="button" aria-label="サイコロを開く">🎲</button>
  <div class="modal-backdrop" id="diceModal" hidden>
    <section class="roulette-modal dice-modal" role="dialog" aria-modal="true" aria-labelledby="diceModalTitle">
      <button class="modal-close" id="closeDiceModal" type="button" aria-label="閉じる">×</button>
      <p class="eyebrow">DICE</p>
      <h2 id="diceModalTitle">サイコロ</h2>
      <div class="dice-stage big"><div class="dice-scene big"><div class="dice3d" id="modalDice"></div></div></div>
      <button class="primary-button" id="modalRollButton" type="button">サイコロを振る</button>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
